name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyBgl35MhXrJnmbHez8SAt11tG7cDQ_IGiY' }}
          VITE_FIREBASE_AUTH_DOMAIN: 'loy-krathong-festival-e043f.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'loy-krathong-festival-e043f'
          VITE_FIREBASE_STORAGE_BUCKET: 'loy-krathong-festival-e043f.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '1083101375704'
          VITE_FIREBASE_APP_ID: '1:1083101375704:web:60766170a08e3d0c54bbad'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
